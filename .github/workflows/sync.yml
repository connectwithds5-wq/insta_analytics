name: Instagram Analytics Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'

permissions:
  contents: write

concurrency:
  group: instagram-analytics-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Sync Instagram analytics
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_API_VERSION: ${{ secrets.META_API_VERSION || 'v23.0' }}
          DB_PATH: instagram_analytics.db
        run: python sync.py
      - name: Build account-aware recommendations
        env:
          DB_PATH: instagram_analytics.db
        run: python recommendation_engine.py
      - name: Persist database and recommendations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git add instagram_analytics.db recommendations.json
            git diff --cached --quiet || git commit -m 'chore: update Instagram analytics and recommendations'
            git pull --rebase origin main || { git rebase --abort || true; sleep $((attempt * 3)); continue; }
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo 'Failed to push analytics after 3 attempts'
          exit 1
