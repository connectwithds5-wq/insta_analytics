name: Instagram Analytics Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Sync Instagram analytics
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_API_VERSION: ${{ secrets.META_API_VERSION || 'v23.0' }}
          DB_PATH: instagram_analytics.db
        run: python -c "from app import init_db, fetch_and_store; init_db(); print('Synced', fetch_and_store(), 'media items')"
      - name: Persist database
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add instagram_analytics.db
          git diff --cached --quiet || git commit -m 'chore: update Instagram analytics data'
          git push
