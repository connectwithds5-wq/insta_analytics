<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instagram Growth Command Center</title>
<style>
:root{--bg:#090b12;--card:#111522;--card2:#171c2b;--text:#f7f8fc;--muted:#9ba5bd;--line:#252c3d;--accent:#8b7cff;--good:#35d39a;--warn:#ffca67}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#292044 0,#090b12 38%);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:1280px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:22px}.eyebrow{color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:12px}.h1{font-size:clamp(28px,5vw,48px);font-weight:800;line-height:1.05;margin:7px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{background:rgba(17,21,34,.9);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 35px #0003}.metric .label{color:var(--muted);font-size:12px}.metric .value{font-size:28px;font-weight:800;margin-top:3px}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;margin:14px 0}.song{font-size:28px;font-weight:800;margin:8px 0 2px}.pill{display:inline-block;background:#282345;color:#cfcaff;border:1px solid #3b3564;border-radius:999px;padding:4px 9px;font-size:12px}.score{font-size:44px;font-weight:900;color:var(--good)}h2{margin:0 0 12px;font-size:20px}h3{margin:18px 0 8px}.tabs{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.tabs button{background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}.tabs button.active{color:white;border-color:var(--accent);background:#1c1930}.panel{display:none}.panel.active{display:block}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px}.bar{height:10px;background:#242a3a;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.list{display:grid;gap:9px}.item{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card2)}.warning{color:var(--warn);font-size:13px}.chart{height:230px;display:flex;align-items:end;gap:5px;padding-top:18px}.barcol{flex:1;min-width:3px;position:relative}.barcol i{display:block;background:linear-gradient(180deg,var(--accent),#4d4a91);border-radius:5px 5px 0 0}.barcol span{position:absolute;bottom:-20px;font-size:9px;color:var(--muted);left:50%;transform:translateX(-50%)}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.hero,.two{grid-template-columns:1fr}}@media(max-width:520px){main{padding:20px 12px}.grid{grid-template-columns:1fr 1fr}.metric .value{font-size:23px}.song{font-size:22px}}
</style>
</head>
<body><main>
<div class="top"><div><div class="eyebrow">Instagram • Growth Intelligence</div><div class="h1">Growth Command Center</div><div class="muted">Account analytics + trend signals → your next Reel decision.</div></div><div id="updated" class="muted"></div></div>
<div id="metrics" class="grid"></div>
<div class="hero"><section class="card" id="advisor"></section><section class="card" id="signals"></section></div>
<div class="tabs"><button class="active" data-tab="trend">🎵 Trending Audio</button><button data-tab="analytics">📊 Analytics</button><button data-tab="tests">🧪 Experiments</button></div>
<section id="trend" class="panel active card"></section><section id="analytics" class="panel card"></section><section id="tests" class="panel card"></section>
<footer>Trend data is a discovery signal. Always verify the official audio is available/licensed in Instagram before publishing. This page never publishes content.</footer>
</main>
<script>
const fmt=n=>{n=Number(n||0);return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.round(n).toLocaleString()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function calc(reels){let views=0,reach=0,shares=0;reels.forEach(r=>{views+=+r.views||0;reach+=+r.reach||0;shares+=+r.shares||0});let avg=reels.length?reels.reduce((a,r)=>a+((+r.reach?(+r.likes+r.comments+r.shares+r.saves)/+r.reach*100:0)),0)/reels.length:0;return{views,reach,shares,avg}}
fetch('dashboard_data.json?'+Date.now()).then(r=>r.json()).then(d=>{
 const rs=d.reels||[], p=d.profile?.[0]||{}, rec=d.recommendations||{}, trends=(rec.trending_audio_ranked?.length?rec.trending_audio_ranked:d.trend_data?.tracks)||[], primary=rec.primary_recommendation; const m=calc(rs);
 document.getElementById('updated').textContent='Updated '+new Date(d.generated_at).toLocaleString();
 document.getElementById('metrics').innerHTML=[['Reels',rs.length],['Total views',fmt(m.views)],['Total reach',fmt(m.reach)],['Shares',fmt(m.shares)],['Avg engagement',m.avg.toFixed(2)+'%']].map(x=>`<div class="card metric"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('');
 if(primary){document.getElementById('advisor').innerHTML=`<div class="eyebrow">🎯 POST NEXT</div><div class="song">${esc(primary.song)}</div><div class="muted">${esc(primary.artist)}</div><p><span class="pill">${esc(primary.reel_format)}</span> <span class="pill">${String(primary.posting_hour_local??20).padStart(2,'0')}:00</span></p><p>${esc(primary.why)}</p><h3>Hook</h3><b>${esc(primary.hook)}</b><h3>Structure</h3><div class="list">${(primary.structure||[]).map(x=>`<div class="item">${esc(x)}</div>`).join('')}</div><p class="warning">⚠ ${esc(primary.audio_note)}</p>`}else document.getElementById('advisor').innerHTML='<h2>No recommendation yet</h2><p class="muted">Run the Analytics Sync workflow.</p>';
 let sig=rec.sample||{};document.getElementById('signals').innerHTML=`<div class="eyebrow">ACCOUNT SIGNALS</div><div class="score">${trends[0]?.match_score??trends[0]?.trend_score??0}<small>/100</small></div><div class="muted">Top current audio account-fit score</div><h3>Baseline</h3><p>Reach <b>${fmt(sig.baseline_reach)}</b> • Views <b>${fmt(sig.baseline_views)}</b> • Engagement <b>${Number(sig.baseline_engagement||0).toFixed(2)}%</b></p><h3>Best hours</h3><p>${(sig.best_hours||[]).map(x=>String(x.hour).padStart(2,'0')+':00').join(' • ')||'Collecting data…'}</p><h3>Followers</h3><b>${fmt(p.followers)}</b>`;
 document.getElementById('trend').innerHTML=`<h2>🔥 Trending audio</h2><p class="muted">India + global discovery signals • ${esc(d.trend_data?.updated_at||'')}</p><div class="tablewrap"><table><thead><tr><th>#</th><th>Song</th><th>Artist</th><th>Lane</th><th>Fit</th><th>Formats</th></tr></thead><tbody>${trends.slice(0,12).map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.title)}</b></td><td>${esc(x.artist)}</td><td>${esc(x.lane)}</td><td>${x.match_score??x.trend_score}/100</td><td>${esc((x.formats||[]).slice(0,2).join(' • '))}</td></tr>`).join('')}</tbody></table></div>`;
 let sorted=[...rs].sort((a,b)=>(+b.reach||0)-(+a.reach||0)).slice(0,10); document.getElementById('analytics').innerHTML=`<h2>📊 Account performance</h2><div class="two"><div><h3>Top by reach</h3><div class="list">${sorted.map(r=>`<div class="item"><b>${esc((r.caption||'Untitled').slice(0,90))}</b><br><span class="muted">Reach ${fmt(r.reach)} • Views ${fmt(r.views)} • Shares ${fmt(r.shares)}</span></div>`).join('')||'<p class="muted">No Reel data yet.</p>'}</div></div><div><h3>Reach distribution</h3><div class="chart">${sorted.slice().reverse().map(r=>{let max=Math.max(...sorted.map(x=>+x.reach||0),1),h=Math.max(3,(+r.reach||0)/max*190);return `<div class="barcol"><i style="height:${h}px"></i><span>${fmt(r.reach)}</span></div>`}).join('')}</div></div></div>`;
 document.getElementById('tests').innerHTML=`<h2>🧪 Controlled experiments</h2><p class="muted">Change one major variable at a time so reach improvements are attributable.</p><div class="list">${(rec.experiments||[]).map((x,i)=>`<div class="item"><b>Test ${i+1}: ${esc(x.song)}</b><br>${esc(x.artist)} • Score ${x.score}/100<br><span class="muted">${esc(x.format)} — ${esc(x.test)}</span></div>`).join('')||'<p class="muted">Experiments will appear after the next recommendation build.</p>'}</div>`;
}).catch(e=>{document.querySelector('main').innerHTML='<div class="card"><h2>Dashboard data unavailable</h2><p>Run the Instagram Analytics Sync workflow once, then refresh this page.</p></div>'});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});
</script></body></html>
