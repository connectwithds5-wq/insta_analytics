<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instagram Retro Bollywood Growth Command Center</title><style>:root{--bg:#090b12;--card:#111522;--card2:#171c2b;--text:#f7f8fc;--muted:#9ba5bd;--line:#252c3d;--accent:#8b7cff;--good:#35d39a;--warn:#ffca67}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#292044 0,#090b12 38%);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:1280px;margin:auto;padding:24px 16px 50px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.eyebrow{color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:12px}.h1{font-size:clamp(28px,5vw,46px);font-weight:800;line-height:1.05;margin:6px 0}.muted{color:var(--muted)}button{border:1px solid var(--line);border-radius:11px;padding:10px 14px;background:var(--card);color:var(--text);cursor:pointer;font-weight:700}button.primary{background:var(--accent);border-color:var(--accent)}button:disabled{opacity:.55}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.status{padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card2);display:none}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card{background:rgba(17,21,34,.92);border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:0 10px 35px #0003}.metric .label{font-size:12px;color:var(--muted)}.metric .value{font-size:27px;font-weight:800}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:12px;margin:12px 0}.song{font-size:27px;font-weight:800}.pill{display:inline-block;border:1px solid #3b3564;background:#282345;color:#d7d2ff;border-radius:99px;padding:4px 9px;font-size:12px}.score{font-size:42px;font-weight:900;color:var(--good)}h2{margin:0 0 10px}h3{margin:16px 0 7px}.list{display:grid;gap:8px}.item{padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--card2)}.warning{color:var(--warn);font-size:13px}.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.panel{display:none}.panel.active{display:block}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:25px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.hero,.two{grid-template-columns:1fr}}@media(max-width:500px){.top{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr 1fr}.metric .value{font-size:22px}.song{font-size:21px}}</style></head><body><main><div class="top"><div><div class="eyebrow">Instagram • Retro Bollywood Intelligence</div><div class="h1">Growth Command Center</div><div class="muted">Old Hindi Bollywood songs → account-aware Reel strategy.</div></div><div class="controls"><button id="refresh">↻ Refresh</button><button id="run" class="primary">▶ Run Analytics Now</button></div></div><div id="status" class="status"></div><div id="updated" class="muted" style="margin:8px 0"></div><div id="metrics" class="grid"></div><div class="hero"><section class="card" id="advisor"></section><section class="card" id="signals"></section></div><div class="tabs"><button class="active" data-tab="trend">🎵 Retro Audio</button><button data-tab="analytics">📊 Analytics</button><button data-tab="tests">🧪 Experiments</button></div><section id="trend" class="panel active card"></section><section id="analytics" class="panel card"></section><section id="tests" class="panel card"></section><footer>Auto-refresh: every 60 seconds. Analytics sync: every 6 hours automatically + manual button above. This dashboard never publishes content.</footer></main><script>
const RELAY='https://ai-command-center-relay.darjid314.workers.dev';
const fmt=n=>{n=Number(n||0);return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.round(n).toLocaleString()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status=(msg,show=true)=>{let e=document.getElementById('status');e.textContent=msg;e.style.display=show?'block':'none'};
function calc(rs){let v=0,r=0,s=0,e=0;rs.forEach(x=>{v+=+x.views||0;r+=+x.reach||0;s+=+x.shares||0;e+=(+x.reach?(+x.likes+x.comments+x.shares+x.saves)/+x.reach*100:0)});return{v,r,s,e:rs.length?e/rs.length:0}}
async function load(){try{let d=await fetch('dashboard_data.json?'+Date.now()).then(r=>r.json()),rs=d.reels||[],rec=d.recommendations||{},tr=(rec.trending_audio_ranked?.length?rec.trending_audio_ranked:d.trend_data?.tracks)||[],p=rec.primary_recommendation,m=calc(rs),sig=rec.sample||{};document.getElementById('updated').textContent='Data updated '+new Date(d.generated_at).toLocaleString()+' • auto-refresh 60s';document.getElementById('metrics').innerHTML=[['Reels',rs.length],['Total views',fmt(m.v)],['Total reach',fmt(m.r)],['Shares',fmt(m.s)],['Avg engagement',m.e.toFixed(2)+'%']].map(x=>`<div class="card metric"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('');if(p){document.getElementById('advisor').innerHTML=`<div class="eyebrow">🎯 POST NEXT • RETRO BOLLYWOOD MODE</div><div class="song">${esc(p.song)}</div><div class="muted">${esc(p.artist)} • ${esc(p.era)}</div><p><span class="pill">${esc(p.reel_format)}</span> <span class="pill">${String(p.posting_hour_local??20).padStart(2,'0')}:00 IST</span></p><p>${esc(p.why)}</p><h3>Hook</h3><b>${esc(p.hook)}</b><h3>Structure</h3><div class="list">${(p.structure||[]).map(x=>`<div class="item">${esc(x)}</div>`).join('')}</div><p class="warning">⚠ ${esc(p.audio_note)}</p>`}else document.getElementById('advisor').innerHTML='<h2>No recommendation yet</h2><p class="muted">Run Analytics.</p>';document.getElementById('signals').innerHTML=`<div class="eyebrow">ACCOUNT SIGNALS</div><div class="score">${tr[0]?.match_score??0}<small>/100</small></div><div class="muted">Top retro audio fit</div><h3>Baseline</h3><p>Reach <b>${fmt(sig.baseline_reach)}</b> • Views <b>${fmt(sig.baseline_views)}</b> • Engagement <b>${Number(sig.baseline_engagement||0).toFixed(2)}%</b></p><h3>Best IST hours</h3><p>${(sig.best_hours||[]).map(x=>String(x.hour).padStart(2,'0')+':00').join(' • ')||'Collecting…'}</p><h3>Followers</h3><b>${fmt(d.profile?.[0]?.followers)}</b>`;document.getElementById('trend').innerHTML=`<h2>🔥 Retro Bollywood audio</h2><p class="muted">${esc(d.trend_data?.updated_at||'')} • new releases are excluded unless classified as retro revival.</p><div class="tablewrap"><table><thead><tr><th>#</th><th>Song</th><th>Artist</th><th>Era</th><th>Fit</th><th>Format</th></tr></thead><tbody>${tr.slice(0,15).map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.title)}</b></td><td>${esc(x.artist)}</td><td>${esc(x.era)}</td><td>${x.match_score??x.trend_score}/100</td><td>${esc((x.formats||[]).slice(0,2).join(' • '))}</td></tr>`).join('')}</tbody></table></div>`;let sorted=[...rs].sort((a,b)=>(+b.reach||0)-(+a.reach||0)).slice(0,10);document.getElementById('analytics').innerHTML=`<h2>📊 Account performance</h2><div class="two"><div><h3>Top reels by reach</h3><div class="list">${sorted.map(x=>`<div class="item"><b>${esc((x.caption||'Untitled').slice(0,90))}</b><br><span class="muted">Reach ${fmt(x.reach)} • Views ${fmt(x.views)} • Shares ${fmt(x.shares)}</span></div>`).join('')}</div></div><div><h3>Best posting days</h3><div class="list">${(sig.best_days||[]).map(x=>`<div class="item"><b>${esc(x.day)}</b> — score ${x.score}</div>`).join('')||'<div class="item">Collecting data…</div>'}</div></div></div>`;document.getElementById('tests').innerHTML=`<h2>🧪 Controlled experiments</h2><p class="muted">Test retro audio + hook while keeping the story quality constant.</p><div class="list">${(rec.experiments||[]).map((x,i)=>`<div class="item"><b>Test ${i+1}: ${esc(x.song)}</b><br>${esc(x.artist)} • ${x.score}/100 • ${esc(x.era||'')}</div>`).join('')||'<div class="item">Experiments will appear after Analytics.</div>'}</div>`}catch(e){status('Dashboard data unavailable. The next sync will rebuild it.')}}
document.getElementById('refresh').onclick=()=>load();document.getElementById('run').onclick=async()=>{let b=document.getElementById('run');b.disabled=true;status('⏳ Starting Instagram Analytics Sync…');try{let r=await fetch(RELAY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({repo:'insta_analytics',workflow:'sync.yml'})});let x=await r.json();if(!r.ok||!x.ok)throw new Error(x.details||x.error||('HTTP '+r.status));status('✅ Analytics Sync started. Data will refresh automatically when GitHub finishes.');setTimeout(load,15000)}catch(e){status('❌ Could not start sync: '+e.message)}finally{b.disabled=false}};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});load();setInterval(load,60000);
</script></body></html>
